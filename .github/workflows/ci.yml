name: CI

on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The SDK is a private package on GitHub Packages (docs/decisions/0001-foundation.md).
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Needs Read access of this repository to @neramsoft/probiz-sdk and @neramsoft/probiz-blocks
      # (each package's settings, Manage Actions access).
      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      # The site, built, against the fixture API (e2e/support): no CMS is needed.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14

  # The files that only the server runs: they are checked here, because nothing else would until the
  # first deploy. Docker Compose is on the runner; `config` needs no daemon and no image.
  deploy-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # deploy/.env.example filled in as on the server, with the one value deploy-site writes.
      - name: deploy/compose.yml is valid with deploy/.env.example
        env:
          SITE_RELEASE: 0.0.0
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml --env-file deploy/.env.example config --quiet
          # deploy-site reads the image from here.
          test "$(docker compose -f deploy/compose.yml --env-file deploy/.env.example config --images)" = "ghcr.io/neramsoft/bricks-site:0.0.0"

      # A setting the site cannot run without must stop `compose up` with a message.
      - name: deploy/compose.yml refuses a missing SITE_RELEASE, API_URL or SITE_URL
        run: |
          set -u
          # Compose names only the first missing setting, so leave out one at a time.
          for name in SITE_RELEASE API_URL SITE_URL; do
            env_file="$RUNNER_TEMP/env-without-$name"
            printf 'SITE_RELEASE=0.0.0\nAPI_URL=https://api.example.test\nSITE_URL=https://example.test\n' \
              | grep -v "^$name=" >"$env_file"
            if env -u SITE_RELEASE -u API_URL -u SITE_URL \
              docker compose -f deploy/compose.yml --env-file "$env_file" config --quiet 2>"$RUNNER_TEMP/err"; then
              echo "::error::compose.yml accepted an environment without $name"; exit 1
            fi
            grep -q "$name" "$RUNNER_TEMP/err" || { echo "::error::compose.yml does not name $name when it is missing"; cat "$RUNNER_TEMP/err"; exit 1; }
          done

      # The label deploy-site reads (client-site.md) and the minimum the README states are one number.
      - name: The image's minimum CMS version matches the README
        run: |
          set -euo pipefail
          docker_min="$(sed -nE 's/^ARG MIN_CMS_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)"
          readme_min="$(sed -nE 's/^Lowest ProBiz CMS version: ([0-9]+\.[0-9]+\.[0-9]+)\.?$/\1/p' README.md)"
          grep -q 'org.probiz.min-cms-version="${MIN_CMS_VERSION}"' Dockerfile
          test -n "$docker_min" && test "$docker_min" = "$readme_min"

      - name: Lint the workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
